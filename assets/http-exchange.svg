<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="t desc"><title id="t">An HTTP request and response</title><desc id="desc">A browser requests a page from a server. The server returns a status, headers, and content.</desc><rect width="720" height="420" rx="12" fill="#e8f0ef"/><g font-family="sans-serif"><rect x="45" y="105" width="170" height="155" rx="8" fill="white" stroke="#557779" stroke-width="2"/><rect x="60" y="120" width="140" height="100" rx="3" fill="#f4f7f6" stroke="#aac1bf"/><path d="M100 245h60M130 225v20" stroke="#557779" stroke-width="3"/><text x="130" y="163" text-anchor="middle" font-size="28" fill="#086b70">&lt;/&gt;</text><text x="130" y="195" text-anchor="middle" font-size="17" fill="#172b3a">Browser</text><rect x="505" y="105" width="170" height="155" rx="8" fill="white" stroke="#557779" stroke-width="2"/><rect x="525" y="125" width="130" height="35" rx="4" fill="#e8f0ef"/><rect x="525" y="172" width="130" height="35" rx="4" fill="#e8f0ef"/><circle cx="640" cy="142" r="4" fill="#086b70"/><circle cx="640" cy="189" r="4" fill="#086b70"/><text x="590" y="242" text-anchor="middle" font-size="17" fill="#172b3a">Server</text><path d="M235 145H477l-12-8m12 8-12 8" fill="none" stroke="#086b70" stroke-width="3"/><text x="355" y="118" text-anchor="middle" font-size="16" fill="#086b70">GET /lessons</text><path d="M485 223H243l12-8m-12 8 12 8" fill="none" stroke="#a7502b" stroke-width="3"/><text x="360" y="201" text-anchor="middle" font-size="16" fill="#944123">200 OK + HTML</text><text x="360" y="327" text-anchor="middle" font-size="19" font-weight="bold" fill="#172b3a">One exchange. One resource.</text><text x="360" y="360" text-anchor="middle" font-size="15" fill="#526573">CSS, images, and scripts can each require another request.</text></g></svg>